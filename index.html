<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f3f4;font-family:Arial,Helvetica,sans-serif;color:#202124}
.header{height:56px;background:#fff;border-bottom:1px solid #dadce0;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:5}
.title{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center}
button{border:1px solid #dadce0;background:#fff;border-radius:4px;padding:7px 11px;cursor:pointer}
button:hover{background:#f8f9fa}
#pages{padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:18px}
.page{background:#fff;box-shadow:0 1px 5px #bbb;max-width:100%;height:auto}
.status{font-size:13px;color:#5f6368;min-width:80px;text-align:center}
.note{position:fixed;bottom:10px;left:10px;background:#fff;border:1px solid #dadce0;border-radius:6px;padding:7px 10px;font-size:11px;color:#5f6368}
@media(max-width:600px){.title{max-width:130px}.header{padding:0 10px}.controls{gap:3px}.controls button{padding:6px 8px}}
</style>
</head>
<body>
<div class="header">
  <div class="title">Document Viewer — Demo</div>
  <div class="controls">
    <button onclick="changeZoom(-0.1)">−</button>
    <span class="status" id="zoom">100%</span>
    <button onclick="changeZoom(0.1)">+</button>
  </div>
</div>
<div id="pages"></div>
<div class="note">Demo viewer — not an official website</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

const pdfUrl = "./document.pdf";
const container = document.getElementById("pages");
let zoom = 1;

async function render() {
  container.innerHTML = "";
  const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const base = page.getViewport({scale: 1});
    const maxWidth = Math.min(window.innerWidth - 24, 900);
    const scale = (maxWidth / base.width) * zoom;
    const viewport = page.getViewport({scale});

    const canvas = document.createElement("canvas");
    canvas.className = "page";
    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);
    canvas.setAttribute("aria-label", `Page ${n}`);

    const ctx = canvas.getContext("2d");
    await page.render({canvasContext: ctx, viewport}).promise;
    container.appendChild(canvas);
  }
  document.getElementById("zoom").textContent = Math.round(zoom*100) + "%";
}
window.changeZoom = (delta) => {
  zoom = Math.max(.5, Math.min(2, zoom + delta));
  render();
};
window.addEventListener("resize", () => render());
render().catch(err => {
  container.innerHTML = "<p>Unable to load the document.</p>";
  console.error(err);
});
</script>
</body>
</html>
